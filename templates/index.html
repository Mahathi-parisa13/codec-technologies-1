<!DOCTYPE html>
<html>
<head>

    <title>AI Fraud Detection</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f2f6ff;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 500px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 15px #ccc;
        }

        h1 {
            text-align: center;
            color: #1d4ed8;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            text-align: center;
            background: #eef2ff;
            border-radius: 8px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>AI Fraud Detection</h1>

    <form action="/predict" method="POST">

        <label>Step</label>
        <input type="number" name="step" value="1" required>

        <label>Transaction Type</label>

        <select name="type" required>

            <option value="PAYMENT">PAYMENT</option>
            <option value="TRANSFER">TRANSFER</option>
            <option value="CASH_OUT">CASH_OUT</option>
            <option value="DEBIT">DEBIT</option>
            <option value="CASH_IN">CASH_IN</option>

        </select>

        <label>Amount</label>
        <input type="number" name="amount" step="0.01" required>

        <label>Old Balance Origin</label>
        <input type="number" name="oldbalanceOrg" step="0.01" required>

        <label>New Balance Origin</label>
        <input type="number" name="newbalanceOrig" step="0.01" required>

        <label>Old Balance Destination</label>
        <input type="number" name="oldbalanceDest" step="0.01" required>

        <label>New Balance Destination</label>
        <input type="number" name="newbalanceDest" step="0.01" required>

        <button type="submit">
            Check Transaction
        </button>

    </form>

    {% if result %}

    <div class="result">

        <h2>{{ result }}</h2>

        {% if probability is not none %}
        <p>
            Fraud Probability: <strong>{{ probability }}%</strong>
        </p>
        {% endif %}

    </div>

    {% endif %}

</div>

</body>
</html>
